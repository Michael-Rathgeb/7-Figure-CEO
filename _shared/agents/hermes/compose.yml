# Hermes Agent — assembled by Agent Deployer. Secrets live in .env only.
services:
  hermes:
    image: nousresearch/hermes-agent:latest
    pull_policy: always
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    env_file:
      - .env
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_USER}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_PASSWORD}
      API_SERVER_ENABLED: ${HERMES_API_ENABLED:-false}
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: ${HERMES_API_KEY:-}
      TZ: ${TZ:-UTC}
    volumes:
      - ./data:/opt/data
    ports:
      - "127.0.0.1:${HERMES_DASHBOARD_HOST_PORT:-9119}:9119"
      - "127.0.0.1:${HERMES_API_HOST_PORT:-8642}:8642"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
